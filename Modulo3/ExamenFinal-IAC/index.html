<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen Terraform · BeTek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-0: #0a0a0f;
      --bg-1: #11111a;
      --accent: #a78bfa;
      --accent-2: #7c3aed;
      --text: #e8e8f0;
      --muted: #8a8aa0;
      --border: rgba(167, 139, 250, 0.18);
    }

    html, body {
      height: 100%;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: var(--bg-0);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      position: relative;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { background: var(--accent-2); top: -200px; left: -150px; }
    .glow-2 { background: #2563eb; bottom: -200px; right: -150px; }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      width: calc(100% - 3rem);
      padding: 3.5rem 3rem;
      background: linear-gradient(180deg, rgba(20, 20, 30, 0.85), rgba(10, 10, 18, 0.85));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 1.75rem;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.4; }
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .meta-item .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .meta-item .value {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
    }

    .footer {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stack {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .stack span {
      padding: 0.2rem 0.6rem;
      background: rgba(167, 139, 250, 0.08);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="container">
    <span class="badge">Static Website · S3</span>
    <h1>Bienvenido al examen Terraform</h1>
    <p class="subtitle">Despliegue de infraestructura como código sobre AWS para el módulo 3 de BeTek.</p>

    <div class="meta">
      <div class="meta-item">
        <div class="label">Estudiante</div>
        <div class="value">pablocastano6</div>
      </div>
      <div class="meta-item">
        <div class="label">Fecha</div>
        <div class="value">27 de abril, 2026</div>
      </div>
      <div class="meta-item">
        <div class="label">Proyecto</div>
        <div class="value">Betek</div>
      </div>
    </div>

    <div class="footer">
      <span>$ terraform apply &mdash; ok</span>
      <div class="stack">
        <span>terraform</span>
        <span>aws</span>
        <span>s3</span>
      </div>
    </div>
  </main>
</body>
</html>
